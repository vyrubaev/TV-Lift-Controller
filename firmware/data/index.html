<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TV Lift</title>

    <!-- PWA Settings (iOS / Android WebApp) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TV Lift">
    <meta name="theme-color" content="#121212">

    <!-- App Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%232e7d32'><rect width='512' height='512' rx='110' fill='%23121212'/><rect x='80' y='120' width='352' height='220' rx='16' fill='none' stroke='%23ffffff' stroke-width='24'/><path d='M200 400h112m-56-60v60' stroke='%23ffffff' stroke-width='24' stroke-linecap='round'/><path d='M256 170v120m-40-40l40 40 40-40' stroke='%232e7d32' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%232e7d32'><rect width='512' height='512' rx='110' fill='%23121212'/><rect x='80' y='120' width='352' height='220' rx='16' fill='none' stroke='%23ffffff' stroke-width='24'/><path d='M200 400h112m-56-60v60' stroke='%23ffffff' stroke-width='24' stroke-linecap='round'/><path d='M256 170v120m-40-40l40 40 40-40' stroke='%232e7d32' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #2e7d32;
            --accent-red: #c62828;
            --accent-blue: #1565c0;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #333;
            color: var(--text-muted);
        }

        .status-badge.online { background: #1b5e20; color: #81c784; }
        .status-badge.offline { background: #b71c1c; color: #ef9a9a; }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            background: #262626;
            padding: 16px;
            border-radius: 18px;
        }

        .telemetry-item {
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .telemetry-item .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .telemetry-item .value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            border: none;
            outline: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-up { background-color: var(--accent-green); }
        .btn-stop { background-color: var(--accent-red); }
        .btn-down { background-color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>TV Lift Controller</h1>
            <div id="conn-status" class="status-badge offline">CONNECTING...</div>
        </div>

        <div class="telemetry-grid">
            <div class="telemetry-item">
                <span class="label">Status</span>
                <span id="state-val" class="value">...</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-up" onclick="sendCmd('UP')">UP</button>
            <button class="btn btn-stop" onclick="sendCmd('STOP')">STOP</button>
            <button class="btn btn-down" onclick="sendCmd('DOWN')">DOWN</button>
        </div>
    </div>

    <script>
        let ws;

        // Карта статусов: число -> человеческий текст
        const STATE_NAMES = {
            0: 'OPEN',
            1: 'CLOSED',
            2: 'MOVING_UP',
            3: 'MOVING_DOWN',
            4: 'RUN_ON',
            5: 'STOPPED',
            6: 'EMERGENCY',
            7: 'TIMEOUT',
            8: 'UNKNOWN'
        };

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                const badge = document.getElementById('conn-status');
                badge.innerText = 'ONLINE';
                badge.className = 'status-badge online';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.st !== undefined) {
                        document.getElementById('state-val').innerText = STATE_NAMES[data.st] || `CODE (${data.st})`;
                    }
                } catch(e) {}
            };

            ws.onclose = () => {
                const badge = document.getElementById('conn-status');
                badge.innerText = 'OFFLINE';
                badge.className = 'status-badge offline';
                setTimeout(connect, 2000);
            };
        }

        function sendCmd(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: action }));
            }
        }

        window.onload = connect;
    </script>
</body>
</html>
