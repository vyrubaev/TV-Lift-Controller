<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TV Lift Controller</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #2e7d32;
            --accent-red: #c62828;
            --accent-blue: #1565c0;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #333;
            color: var(--text-muted);
        }

        .status-badge.online { background: #1b5e20; color: #81c784; }
        .status-badge.offline { background: #b71c1c; color: #ef9a9a; }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #262626;
            padding: 16px;
            border-radius: 16px;
        }

        .telemetry-item {
            display: flex;
            flex-direction: column;
        }

        .telemetry-item .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .telemetry-item .value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            border: none;
            outline: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-up { background-color: var(--accent-green); }
        .btn-stop { background-color: var(--accent-red); }
        .btn-down { background-color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>TV Lift Controller</h1>
            <div id="conn-status" class="status-badge offline">ПОДКЛЮЧЕНИЕ...</div>
        </div>

        <div class="telemetry-grid">
            <div class="telemetry-item">
                <span class="label">Мотор 1</span>
                <span id="m1-val" class="value">0</span>
            </div>
            <div class="telemetry-item">
                <span class="label">Мотор 2</span>
                <span id="m2-val" class="value">0</span>
            </div>
            <div class="telemetry-item">
                <span class="label">Ток системы</span>
                <span id="amp-val" class="value">0.0 А</span>
            </div>
            <div class="telemetry-item">
                <span class="label">Состояние</span>
                <span id="state-val" class="value">IDLE</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-up" onclick="sendCmd('UP')">▲ ВВЕРХ</button>
            <button class="btn btn-stop" onclick="sendCmd('STOP')">■ СТОП</button>
            <button class="btn btn-down" onclick="sendCmd('DOWN')">▼ ВНИЗ</button>
        </div>
    </div>

    <script>
        let ws;

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                const badge = document.getElementById('conn-status');
                badge.innerText = 'ОНЛАЙН';
                badge.className = 'status-badge online';
            };

            // Карта статусов: число -> человеческий текст
const STATE_NAMES = {
    0: 'OPEN',
    1: 'CLOSED',
    2: 'MOVING_UP',
    3: 'MOVING_DOWN',
    4: 'RUN_ON',
    5: 'STOPPED',
    6: 'EMERGENCY,',
    7: 'TIMEOUT',
    8: 'UNKNOWN'
};

ws.onmessage = (event) => {
    try {
        const data = JSON.parse(event.data);
        
        if (data.m1 !== undefined) document.getElementById('m1-val').innerText = data.m1;
        if (data.m2 !== undefined) document.getElementById('m2-val').innerText = data.m2;
        
        // Отображение тока
        if (data.amp !== undefined) {
            document.getElementById('amp-val').innerText = data.amp.toFixed(2) + ' А';
        }
        
        // Превращаем цифру состояния в текст
        if (data.st !== undefined) {
            document.getElementById('state-val').innerText = STATE_NAMES[data.st] || `КОД (${data.st})`;
        }
    } catch(e) {}
};

            ws.onclose = () => {
                const badge = document.getElementById('conn-status');
                badge.innerText = 'ОФФЛАЙН';
                badge.className = 'status-badge offline';
                setTimeout(connect, 2000); // Переподключение
            };
        }

        function sendCmd(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: action }));
            }
        }

        window.onload = connect;
    </script>
</body>
</html>
